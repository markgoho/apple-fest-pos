{{define "content"}}
<main class="chooser">
  <section class="card">
    <p class="eyebrow">Apple Fest</p>
    <h1>Booth point of sale</h1>
    <p>Open the Cashier POS to take orders.</p>
    <nav class="modes">
      <a href="/pos">Cashier POS</a>
    </nav>
    <p class="fault" id="mode-fault" role="status"></p>
    <div class="kiosk-controls">
      <button type="button" id="kiosk-refresh" class="ghost">Refresh</button>
      <a href="/system-admin" class="ghost">System Admin</a>
    </div>
    <p class="build">{{if .Version}}{{.Version}}{{if .Dirty}}-dirty{{end}}{{else}}dev build{{end}}</p>
  </section>
</main>
{{end}}

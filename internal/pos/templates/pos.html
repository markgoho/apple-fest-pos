{{define "content"}}
<main class="pos">
  <section class="workspace">
    <header class="bar">
      <a class="home" href="/">Apple Fest POS</a>
      <p class="notice" id="notice" role="status"></p>
    </header>

    <section class="menu" aria-label="Menu items">
      {{range .MenuItems}}
      <button type="button" class="menu-item" data-menu-item-id="{{.ID}}" data-name="{{.Name}}"
              data-price-cents="{{.PriceCents}}" data-sides="{{.SideList}}">
        <strong>{{.Name}}</strong>
        <span class="price">{{cents .PriceCents}}</span>
      </button>
      {{end}}
    </section>
  </section>

  <aside class="cart" aria-label="Current order">
    <div class="bar">
      <h2>Order</h2>
      <button type="button" class="ghost" id="clear" disabled>Clear</button>
    </div>

    <p class="empty" id="empty">Tap menu items to start an order.</p>
    <div class="lines" id="lines"></div>

    <div class="checkout">
      <strong class="total" id="total">{{cents 0}}</strong>
      <button type="button" class="submit" id="submit" disabled>Submit order</button>
    </div>
  </aside>
</main>
<script src="{{asset "/static/pos.js"}}" defer></script>
{{end}}

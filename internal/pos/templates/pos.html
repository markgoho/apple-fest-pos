{{define "content"}}
<main class="pos">
  <div class="top-row">
    <button type="button" class="more-btn" id="more" aria-expanded="false" aria-controls="more-sheet">More</button>
    <header class="band">
      <a class="home" href="/">Apple Fest POS</a>
      <p class="order-no">Last order <output class="n" id="last-order">—</output></p>
      <p class="fault" id="fault" role="status"></p>
      <button type="button" class="neutral-btn" id="reprint" disabled>Reprint</button>
    </header>
  </div>

  <div class="body">
    <div class="menu" id="menu">
      {{range $i, $section := .MenuSections}}
      <section class="menu-section" aria-labelledby="menu-section-{{$i}}">
        <h2 class="menu-section-label" id="menu-section-{{$i}}">{{$section.Category}}</h2>
        <ul class="tiles" aria-label="{{.Category}} items">
          {{range .Tiles}}
          <li>
            <button type="button" class="tile" data-menu-item-id="{{.MenuItemID}}" data-name="{{.Name}}"
                    data-price-cents="{{.PriceCents}}" data-side-id="{{.SideID}}" data-side-label="{{.SideLabel}}">
              {{if .SideLabel}}<strong>{{.SideLabel}}</strong>{{else}}<strong>{{.Label}}</strong>{{end}}
              <span class="price">{{cents .PriceCents}}</span>
            </button>
          </li>
          {{end}}
        </ul>
      </section>
      {{end}}
    </div>

    <aside class="cart" aria-label="Current order">
      <ul class="lines" id="lines"></ul>

      <div class="checkout">
        <output class="total" id="total">{{cents 0}}</output>
        <button type="button" class="submit-btn" id="submit" disabled>Submit</button>
      </div>
    </aside>
  </div>

  <div class="scrim" id="scrim" hidden></div>

  <div class="sheet" id="more-sheet" role="dialog" aria-modal="true" aria-labelledby="more-title" hidden>
    <h2 class="sheet-title" id="more-title">More</h2>
    <button type="button" class="sheet-danger" id="clear" disabled>Clear order</button>
    <button type="button" class="sheet-close" id="more-close">Close</button>
  </div>
</main>
<script src="{{asset "/static/pos.js"}}" defer></script>
{{end}}

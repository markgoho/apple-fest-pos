<!doctype html>
<!--
  PROTOTYPE — throwaway. Answers issue #11 "Choose the visualizations for
  the sales screen" (child of map #8, "Sales screen for adult leaders").
  Fake data for one 8am-6pm event day. Three variants of chart set + chart
  placement on the existing Leader Figures tab, switchable with ?variant=.
  Not production code: charts are drawn with a little JS math here for
  speed. The real implementation bakes static SVG via html/template, no
  client-side math.
  Run: go run ./cmd/pos, then open /static/prototype-figures-viz.html
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>PROTOTYPE — Figures tab visualizations</title>
    <link rel="stylesheet" href="pos.css">
    <style>
      /* Prototype-only chrome, not part of the design being judged. */
      body.theme { user-select: auto; -webkit-user-select: auto; }

      .proto-banner {
        background: #222;
        color: #fff;
        font: 700 0.8rem/1.4 monospace;
        padding: 0.5rem 1rem;
        text-align: center;
      }

      .viz-switcher {
        position: fixed;
        inset-inline: 0;
        inset-block-end: 1rem;
        display: flex;
        justify-content: center;
        z-index: 200;
      }

      .viz-switcher .pill {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        background: #111;
        color: #fff;
        border-radius: 999px;
        padding: 0.4rem 0.4rem 0.4rem 0.9rem;
        box-shadow: 0 0.5rem 1.5rem #0006;
        font: 700 0.85rem/1.2 monospace;
      }

      .viz-switcher button {
        min-block-size: 2.2rem;
        min-inline-size: 2.2rem;
        border: 0;
        border-radius: 999px;
        background: #333;
        color: #fff;
        font-weight: 900;
      }

      .viz-switcher button:active { background: #555; }

      /* Chart building blocks these variants share. */

      .chart-block {
        display: grid;
        gap: 0.5rem;
      }

      .chart-block h3 {
        margin: 0;
        font-size: 1rem;
        color: var(--apple-red-dark);
      }

      .chart-block svg { display: block; inline-size: 100%; }

      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        font-size: 0.75rem;
        color: var(--gold-tan-ink);
        font-weight: 700;
      }

      .legend span { display: inline-flex; align-items: center; gap: 0.3rem; }

      .legend i {
        inline-size: 0.7rem;
        block-size: 0.7rem;
        border-radius: 0.2rem;
        display: inline-block;
      }

      .day-toggle {
        display: flex;
        gap: 0.4rem;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 0.7rem;
        padding: 0.25rem;
        font-size: 0.85rem;
      }

      .day-toggle button {
        flex: 1;
        min-block-size: 2.2rem;
        border: none;
        background: transparent;
        border-radius: 0.5rem;
        font-weight: 700;
        color: var(--orchard-brown);
      }

      .day-toggle button[aria-selected="true"] {
        background: var(--leaf-green);
        color: white;
      }
    </style>
  </head>
  <body class="theme">
    <div class="proto-banner">PROTOTYPE — issue #11 — not real data, not shipped</div>
    <main class="sales leader" id="app"></main>
    <div class="viz-switcher" id="switcher"></div>
    <script src="prototype-figures-viz.js"></script>
  </body>
</html>
